<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa cosistico de ventas</title>
</head>

<body>
    
    <div id="lista-productos"></div>
    
    <form method="post">
        <h3>Registrar producto</h3>
        <label for="name-prd">Nombre del producto</label>
        <input type="text" name="name-prd" id="nameProd">
        <label for="price-prd">Precio del producto</label>
        <input type="number" name="price-prd" id="priceProd">
        <label for="cant-prd">Cantidad del producto</label>
        <input type="number" name="cant-prd" id="cantProd">
        <button type="submit" id="submit-btn">Guardar</button>
    </form>

    <script src="front.js"></script>
</body>

</html>
